<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .love {
            position: absolute;
            transform-style: preserve-3d;
            animation: rotateHeart 10s linear infinite;
        }

        .love_horizontal {
            position: absolute;
            transform-style: preserve-3d;
        }

        .love_vertical {
            position: absolute;
            transform-style: preserve-3d;
        }

        .love_word {
            position: absolute;
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            /* Dynamic color changing effect similar to the video */
            animation: colorChange 5s linear infinite;
        }

        @keyframes rotateHeart {
            0% {
                transform: rotateY(0deg) rotateX(10deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }

        @keyframes colorChange {
            0% { color: #ff69b4; text-shadow: 0 0 8px #ff1493; }
            33% { color: #00ffff; text-shadow: 0 0 8px #008b8b; }
            66% { color: #ff4500; text-shadow: 0 0 8px #ff8c00; }
            100% { color: #ff69b4; text-shadow: 0 0 8px #ff1493; }
        }
    </style>
</head>
<body>

<div class="scene" id="scene"></div>

<script>
    const totalItems = 300;
    const scene = document.getElementById('scene');

    // Main container for rotation
    const love = document.createElement('div');
    love.className = 'love';
    scene.appendChild(love);

    for (let i = 1; i <= totalItems; i++) {
        const love_horizontal = document.createElement('div');
        love_horizontal.className = 'love_horizontal';
        // Mathematical distribution for heart shape in 3D space
        let t = (i / totalItems) * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        
        love_horizontal.style.setProperty('--i', i);
        love_horizontal.style.transform = `translate3d(${x * 15}px, ${y * 15}px, 0px)`;

        const love_vertical = document.createElement('div');
        love_vertical.className = 'love_vertical';
        love_vertical.style.transform = `rotateY(${i * 10}deg)`;

        const love_word = document.createElement('div');
        love_word.className = 'love_word';
        love_word.innerText = "I love you";
        
        // Delay each word animation for smooth wave effect
        love_word.style.animationDelay = `${i * -0.05}s`;

        love_vertical.appendChild(love_word);
        love_horizontal.appendChild(love_vertical);
        love.appendChild(love_horizontal);
    }
</script>

</body>
</html>
